[package]
name = "executor-node"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "Entros gateway, challenge service, risk composer, attestation issuer, and Solana relayer"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "2.2"
solana-sdk = "2.2"
solana-transaction-status = "2.2"
borsh = { version = "1", features = ["derive"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "trace"] }
# Needed to name `LengthLimitError` when classifying a body-read failure.
# Already in the tree via axum and tower-http; declared so the downcast in
# `timing::classify_body_error` does not depend on a transitive path.
http-body-util = "0.1"
thiserror = "2"
rand = "0.8"
subtle = "2"
zeroize = "1"
bs58 = "0.5"
governor = "0.8"
dashmap = "6"
futures-util = "0.3"
solana-attestation-service-client = "1.0.9"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# `test-util` gives `#[tokio::test(start_paused = true)]`, which lets the
# timing tests assert against the real 4-second clamp in virtual time.
# `full` does not include it. Dev-only, so it stays out of the binary.
tokio = { version = "1", features = ["test-util"] }
